name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux quality and browsers
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pinned pnpm
        run: npm install --global pnpm@10.8.0
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client and build shared packages
        run: |
          pnpm db:generate
          pnpm exec turbo run compile --filter=@kopaka/validation --filter=@kopaka/ui
      - name: Install Chromium, Firefox and WebKit
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Check Docker and Compose
        run: |
          docker version
          docker compose version
      - name: Lint, format, types, unit, real integration, production build and E2E
        run: pnpm quality
      - name: Preserve quality and browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-quality-${{ github.run_attempt }}
          path: |
            quality-results/
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14

  windows:
    name: Windows clean install and build
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pinned pnpm and frozen dependencies
        run: |
          npm install --global pnpm@10.8.0
          pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Check types and production builds without local env files
        run: pnpm quality --only "typecheck,build"
      - name: Preserve Windows smoke results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-build-${{ github.run_attempt }}
          path: quality-results/
          if-no-files-found: warn
          retention-days: 14
